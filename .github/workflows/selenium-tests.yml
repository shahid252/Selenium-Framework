name: Selenium TestNG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run TestNG suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb

      - name: Run tests
        working-directory: TestNG framwork
        run: mvn -B test

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: |
            TestNG framwork/target/surefire-reports/**
            TestNG framwork/test-output/**
          if-no-files-found: ignore
